name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: Trevor-030
          # gold on black: empty days dark, busier days brighter gold
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/snake-gold-dark.svg?color_snake=#FFFFFF&color_dots=#1C1812,#5C4415,#A8761F,#D99A2B,#F2B33D&color_dot_border=#0A0A0A
            dist/snake-gold-light.svg?color_snake=#0A0A0A&color_dots=#EEEAE0,#F7D88A,#F2B33D,#C08A25,#7A5A1C&color_dot_border=#DDD6C6
      - name: Publish output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
